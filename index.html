<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entregas | Entrega Fácil</title>
    <link href="assets/vendor/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/entregas.css" />
  </head>
  <body class="min-vh-100 d-flex flex-column">
    <nav class="navbar navbar-expand-sm bg-white border-bottom border-dark">
      <div class="container">
        <a
          class="navbar-brand d-inline-flex align-items-center gap-2 fw-bold text-uppercase"
          href="index.html"
          ><img
            class="ef-brand-icon img-fluid object-fit-contain"
            src="assets/images/entrega-icon-32.webp"
            srcset="
              assets/images/entrega-icon-32.webp 32w,
              assets/images/entrega-icon-64.webp 64w,
              assets/images/entrega-icon-96.webp 96w
            "
            sizes="32px"
            width="32"
            height="32"
            alt=""
          />Entrega Fácil</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Abrir menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <div class="navbar-nav ms-auto align-items-sm-center gap-sm-3">
            <a class="nav-link active" aria-current="page" href="index.html">Entregas</a
            ><a class="btn btn-dark btn-sm px-3" href="pages/cadastro.html">+ Nova Entrega</a>
          </div>
        </div>
      </div>
    </nav>
    <main class="container flex-grow-1 pt-4 pt-sm-5 pb-5">
      <header
        class="border-bottom border-dark pb-3 mb-4 gap-3 d-flex flex-column flex-sm-row justify-content-between align-items-sm-end"
      >
        <div>
          <div class="ef-kicker fw-medium text-secondary text-uppercase">
            Controle de expedição // Painel operacional
          </div>
          <h1 class="ef-page-title fw-bold my-1">Suas entregas</h1>
          <p class="mb-0 text-secondary">
            Gerencie e acompanhe o status de todas as suas remessas.
          </p>
        </div>
        <div class="ef-kicker fw-medium text-secondary text-uppercase mt-3 mt-sm-0">
          <span id="delivery-count">0</span> entregas
        </div>
      </header>
      <section aria-label="Filtros de entregas" class="mb-4">
        <div class="row g-3 align-items-center">
          <div class="col-12 col-lg-6">
            <div class="input-group">
              <span class="input-group-text bg-white" aria-hidden="true">⌕</span
              ><input
                id="delivery-search"
                class="form-control"
                type="search"
                placeholder="Buscar por número, cliente ou produto..."
                aria-label="Buscar entregas"
              />
            </div>
          </div>
          <div class="col-12 col-lg-6">
            <nav class="nav nav-pills flex-wrap gap-2" aria-label="Filtrar por status">
              <button
                class="btn btn-dark btn-sm"
                type="button"
                data-filter="todos"
                aria-pressed="true"
              >
                Todas</button
              ><button
                class="btn btn-outline-dark btn-sm"
                type="button"
                data-filter="Pendente"
                aria-pressed="false"
              >
                Pendentes</button
              ><button
                class="btn btn-outline-dark btn-sm"
                type="button"
                data-filter="Em transporte"
                aria-pressed="false"
              >
                Em transporte</button
              ><button
                class="btn btn-outline-dark btn-sm"
                type="button"
                data-filter="Entregue"
                aria-pressed="false"
              >
                Entregues</button
              ><button
                class="btn btn-outline-dark btn-sm"
                type="button"
                data-filter="Cancelada"
                aria-pressed="false"
              >
                Canceladas
              </button>
            </nav>
          </div>
        </div>
      </section>
      <div id="persistence-notice" class="alert d-none" role="status"></div>
      <div id="app-alert" class="alert alert-warning d-none" role="alert"></div>
      <section
        id="delivery-list"
        aria-busy="true"
        class="ef-delivery-list row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4"
        aria-live="polite"
        aria-label="Lista de entregas"
      ></section>
      <div id="delivery-empty" class="card bg-white border-dark ef-card p-4 text-center d-none">
        <h2 class="h5 ef-heading">Nenhuma entrega encontrada</h2>
        <p class="mb-0 text-secondary">Cadastre uma entrega ou ajuste os filtros.</p>
      </div>
    </main>
    <footer class="small border-top border-dark bg-white text-secondary py-3 mt-auto">
      <div class="container d-flex flex-wrap justify-content-between gap-2">
        <span class="ef-heading text-uppercase">Entrega Fácil</span
        ><span>© 2026 Entrega Fácil</span>
      </div>
    </footer>
    <script src="assets/vendor/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/app.js"></script>
    <template id="delivery-card-template">
      <div class="col">
        <article class="card bg-white border-dark ef-card ef-delivery-card h-100">
          <div
            class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2"
          >
            <h2 class="h6 ef-heading mb-0" data-field="number"></h2>
            <span data-field="status"></span>
          </div>
          <div class="card-body">
            <span class="ef-meta d-block fw-medium text-secondary text-uppercase">Produto</span>
            <p class="small mb-3 text-break" data-field="product"></p>
            <span class="ef-meta d-block fw-medium text-secondary text-uppercase">Cliente</span>
            <p class="small mb-3 text-break" data-field="client"></p>
            <span class="ef-meta d-block fw-medium text-secondary text-uppercase">Itinerário</span>
            <p class="small mb-3 text-break" data-field="route"></p>
          </div>
          <div
            class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2"
          >
            <span class="small text-secondary" data-field="date"></span>
            <a class="link-dark small fw-semibold text-nowrap" data-field="details"
              >Ver detalhes →</a
            >
          </div>
        </article>
      </div>
    </template>
  </body>
</html>
